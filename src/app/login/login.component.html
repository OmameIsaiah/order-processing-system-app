<div class="login-container">
    <div class="logo">
        <img src="assets/logo.png" alt="Order Processing Service Logo">
    </div>
    <h2>Login to your account</h2>
    <p>Welcome back! Please enter your details.</p>
    <form (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" [(ngModel)]="email" name="email" required
                placeholder="isaianomame@gmail.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" [(ngModel)]="password" name="password" required>
            <a href="#" class="forgot-password">Forgot Password?</a>
        </div>
        <div class="form-group remember-me">
            <input type="checkbox" id="remember-me">
            <label for="remember-me">Remember for 30 days</label>
        </div>
        <button type="submit">Login</button>
    </form>
    <p class="signup-link">Don't have an account? <a routerLink="/signup">Register</a></p>
    <footer>
        <p>© 2025 Order Processing System</p>
    </footer>
</div>
