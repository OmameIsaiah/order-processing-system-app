<div class="users-management-container">
    <h2>User Management</h2>

    <!-- Search and Filter Section -->
    <div class="search-filter-section">
        <mat-form-field appearance="fill">
            <mat-label>Search User</mat-label>
            <input matInput [(ngModel)]="searchKeyword" (input)="searchUsers()" placeholder="Enter name or email">
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Filter by User Type</mat-label>
            <mat-select [(ngModel)]="selectedUserType" (selectionChange)="filterUsers()">
                <mat-option value="">All</mat-option>
                <mat-option value="ADMIN">ADMIN</mat-option>
                <mat-option value="USER">USER</mat-option>
            </mat-select>
        </mat-form-field>
    </div>

    <!-- Users Table -->
    <div class="table-container">
        <table mat-table [dataSource]="users" class="mat-elevation-z8">
            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Name</th>
                <td mat-cell *matCellDef="let user">{{ user.name }}</td>
            </ng-container>

            <!-- Email Column -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef>Email</th>
                <td mat-cell *matCellDef="let user">{{ user.email }}</td>
            </ng-container>

            <!-- User Type Column -->
            <ng-container matColumnDef="userType">
                <th mat-header-cell *matHeaderCellDef>User Type</th>
                <td mat-cell *matCellDef="let user">{{ user.userType }}</td>
            </ng-container>

            <!-- Last Login Column -->
            <ng-container matColumnDef="lastLogin">
                <th mat-header-cell *matHeaderCellDef>Last Login</th>
                <td mat-cell *matCellDef="let user">{{ user.lastLogin }}</td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let user">
                    <button mat-icon-button (click)="openUserDetailsDialog(user)">
                        <mat-icon>visibility</mat-icon>
                    </button>
                    <button mat-icon-button (click)="openDeleteUserDialog(user.uuid)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>

    <!-- Loading Spinner -->
    <div *ngIf="isLoading" class="loading-spinner">
        <mat-spinner></mat-spinner>
    </div>
</div>
