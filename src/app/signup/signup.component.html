<div class="signup-container">
    <div class="logo">
        <img src="assets/logo.png" alt="Order Processing Service Logo">
    </div>
    <h2>Create your account</h2>
    <p>Welcome! Please enter your details to get started.</p>
    <form (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" [(ngModel)]="name" name="name" required placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder="Enter your password">
        </div>
        <div class="form-group">
            <label for="userType">User Type</label>
            <select id="userType" [(ngModel)]="userType" name="userType" required>
                <option value="ADMIN">Admin</option>
                <option value="USER">User</option>
            </select>
        </div>
        <button type="submit">Sign Up</button>
    </form>
    <p class="login-link">Already have an account? <a routerLink="/login">Login</a></p>
    <footer>
        <p>© 2025 Order Processing System</p>
    </footer>
</div>
