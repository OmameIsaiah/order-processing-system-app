<mat-tab-group>
    <!-- Tab 1: Update Password -->
    <mat-tab label="Update Password">
        <div class="form-container">
            <mat-form-field appearance="fill">
                <mat-label>Current Password</mat-label>
                <input matInput type="password" [(ngModel)]="currentPassword" required>
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-label>New Password</mat-label>
                <input matInput type="password" [(ngModel)]="newPassword" required>
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-label>Confirm New Password</mat-label>
                <input matInput type="password" [(ngModel)]="confirmNewPassword" required>
            </mat-form-field>

            <button mat-raised-button color="primary" (click)="updatePassword()"
                [disabled]="!currentPassword || !newPassword || !confirmNewPassword">
                Update Password
            </button>
        </div>
    </mat-tab>

    <!-- Tab 2: Roles List -->
    <mat-tab label="Roles List">
        <div class="table-container">
            <button mat-raised-button color="primary" (click)="openAddRoleDialog()" style="margin-bottom: 20px;">
                <mat-icon>add</mat-icon> Add Role
            </button>
            <table mat-table [dataSource]="roles" class="mat-elevation-z8">
                <!-- Name Column -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Name</th>
                    <td mat-cell *matCellDef="let role">{{ role.name }}</td>
                </ng-container>

                <!-- Description Column -->
                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef>Description</th>
                    <td mat-cell *matCellDef="let role">{{ role.description }}</td>
                </ng-container>

                <!-- Permissions Column -->
                <ng-container matColumnDef="permissions">
                    <th mat-header-cell *matHeaderCellDef>Permissions</th>
                    <td mat-cell *matCellDef="let role">{{ role.permissions.join(', ') }}</td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Actions</th>
                    <td mat-cell *matCellDef="let role">
                        <button mat-icon-button (click)="openEditRoleDialog(role)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button (click)="openDeleteRoleDialog(role.uuid)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
    </mat-tab>

</mat-tab-group>
